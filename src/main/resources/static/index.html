<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>Hello，ChatGPT</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20251f;
      --muted: #72776e;
      --green: #315b45;
      --paper: #f7f5f0;
      --line: rgba(32, 37, 31, .12);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 78% 18%, rgba(215, 224, 205, .58), transparent 34%),
        radial-gradient(ellipse at 8% 88%, rgba(232, 218, 192, .44), transparent 31%),
        var(--paper);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page { width: min(1160px, calc(100% - 64px)); margin: 0 auto; }
    header { height: 88px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 650; letter-spacing: .02em; }
    .mark { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid rgba(49,91,69,.25); border-radius: 50%; color: var(--green); font-family: Georgia, serif; font-size: 17px; }
    .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #739878; box-shadow: 0 0 0 4px rgba(115,152,120,.13); }
    main { min-height: calc(100vh - 153px); display: grid; grid-template-columns: 1.08fr .92fr; align-items: center; gap: clamp(30px, 7vw, 100px); padding: 70px 0 82px; }
    .eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 25px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 30px; height: 1px; background: currentColor; }
    h1 { max-width: 620px; margin: 0; font-family: Georgia, "Noto Serif SC", "Songti SC", serif; font-size: clamp(58px, 8vw, 106px); font-weight: 400; letter-spacing: -.075em; line-height: .99; }
    h1 span { display: block; color: var(--green); font-style: italic; letter-spacing: -.07em; }
    .intro { max-width: 420px; margin: 30px 0 0; color: var(--muted); font-size: 15px; line-height: 1.9; }
    .actions { display: flex; align-items: center; gap: 20px; margin-top: 34px; }
    button { display: inline-flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 3px; color: #fff; background: var(--green); font: inherit; font-size: 13px; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: #244735; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #9bb69d; outline-offset: 3px; }
    .arrow { font-size: 18px; line-height: 1; }
    .hint { color: #92958d; font-size: 12px; }
    .visual { position: relative; display: grid; place-items: center; min-height: 390px; }
    .orbit { position: absolute; width: min(100%, 410px); aspect-ratio: 1; border: 1px solid rgba(49,91,69,.17); border-radius: 50%; }
    .orbit::before, .orbit::after { content: ""; position: absolute; border: 1px solid rgba(49,91,69,.12); border-radius: 50%; }
    .orbit::before { inset: 11%; }
    .orbit::after { inset: 22%; }
    .orb { position: relative; z-index: 1; width: 190px; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(145deg, #edf0e6, #d6dfd1 56%, #c3d0c3); box-shadow: inset -15px -18px 34px rgba(60,83,63,.12), 0 24px 65px rgba(56,73,55,.14); }
    .orb::before { content: ""; width: 56px; height: 56px; border: 1px solid rgba(49,91,69,.55); border-radius: 50%; box-shadow: 0 0 0 13px rgba(255,255,255,.12), 0 0 0 27px rgba(255,255,255,.09); }
    .spark { position: absolute; z-index: 2; color: #8a9b74; font-family: Georgia, serif; }
    .spark.one { top: 13%; right: 17%; font-size: 23px; }
    .spark.two { bottom: 16%; left: 15%; font-size: 16px; }
    .caption { position: absolute; right: 0; bottom: 5%; color: #8d9188; font-family: Georgia, serif; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; writing-mode: vertical-rl; }
    footer { min-height: 65px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); color: #92958d; font-size: 11px; letter-spacing: .04em; }
    footer span:last-child { font-family: Georgia, serif; font-style: italic; }
    @media (max-width: 720px) {
      .page { width: min(100% - 40px, 540px); }
      header { height: 70px; }
      main { min-height: auto; grid-template-columns: 1fr; gap: 18px; padding: 64px 0 48px; }
      h1 { font-size: clamp(62px, 15vw, 88px); }
      .intro { font-size: 14px; }
      .visual { min-height: 300px; }
      .orbit { width: min(78vw, 300px); }
      .orb { width: 145px; }
      .orb::before { width: 42px; height: 42px; }
      .caption { right: 4%; bottom: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><span class="mark">✳</span><span>A LITTLE HELLO</span></div>
      <div class="status">Ready to begin</div>
    </header>
    <main>
      <section aria-labelledby="welcome-title">
        <p class="eyebrow">A new conversation</p>
        <h1 id="welcome-title">Hello，<span>ChatGPT.</span></h1>
        <p class="intro">一个简单的问候，也可以是许多新想法的开始。欢迎来到这里，随时开启一段对话。</p>
        <div class="actions">
          <button id="hello-button" type="button"><span id="button-label">说声你好</span><span class="arrow" aria-hidden="true">↗</span></button>
          <span class="hint" id="hello-message" aria-live="polite">准备好了吗？</span>
        </div>
      </section>
      <div class="visual" aria-hidden="true">
        <div class="orbit"></div><span class="spark one">✳</span><span class="spark two">✦</span><div class="orb"></div>
        <span class="caption">Curiosity starts here</span>
      </div>
    </main>
    <footer><span>ZHihu Tracker · Welcome</span><span>Make room for ideas.</span></footer>
  </div>
  <script>
    const button = document.getElementById('hello-button');
    const message = document.getElementById('hello-message');
    const label = document.getElementById('button-label');
    button.addEventListener('click', () => {
      message.textContent = '你好！很高兴见到你。';
      label.textContent = '再打个招呼';
    });
  </script>
</body>
</html>
